<!DOCTYPE html>
<html>
<head>
    <title>YT-IG - Hand Control + Smart Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function startTimer(event) {
            event.preventDefault();

            let minutes = document.getElementById("minutes").value;
            const formData = new FormData();
            formData.append("minutes", minutes);

            await fetch("/start", { method: "POST", body: formData });

            setInterval(updateTimer, 1000);
        }

        async function updateTimer() {
            const res = await fetch("/time_left");
            const data = await res.json();
            let remaining = data.seconds;

            let mins = Math.floor(remaining / 60);
            let secs = Math.floor(remaining % 60);

            document.getElementById("timer").innerText =
                `${mins}m ${secs}s`;
        }
    </script>
</head>

<body class="min-h-screen lg:h-screen bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100">
    
    <div class="h-full flex flex-col p-4 max-w-7xl mx-auto lg:overflow-hidden">
        
        <!-- Header -->
        <div class="mb-4 flex-shrink-0">
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg p-4 border border-white/20">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="bg-gradient-to-br from-purple-600 to-blue-600 p-2 rounded-xl shadow-md">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-xl lg:text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600">
                                YT-IG Hand Control
                            </h1>
                            <p class="text-xs text-gray-500 hidden sm:block">Gesture-based browser control</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-green-100 rounded-full">
                            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span class="text-xs font-medium text-green-700">Live</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 min-h-0">
            
            <!-- Left Column: Timer & Gestures -->
            <div class="flex flex-col gap-4 lg:overflow-y-auto">
                
                <!-- Timer Card -->
                <div class="bg-white rounded-xl shadow-lg p-4 flex-shrink-0">
                    <h2 class="text-base lg:text-lg font-semibold text-gray-800 mb-3 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Smart Timer
                    </h2>
                    
                    <form onsubmit="startTimer(event)" class="space-y-3">
                        <input 
                            type="number" 
                            step="0.1" 
                            id="minutes" 
                            placeholder="Minutes" 
                            required
                            class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition text-center text-sm"
                        >
                        <button 
                            type="submit"
                            class="w-full px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-blue-700 transform hover:scale-105 transition duration-200 shadow-md text-sm"
                        >
                            Start Timer
                        </button>
                    </form>

                    <div class="mt-3 p-3 bg-gradient-to-r from-purple-100 to-blue-100 rounded-lg">
                        <p class="text-xs text-gray-600 mb-1 text-center">Time Remaining</p>
                        <h3 id="timer" class="text-lg lg:text-xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-600">
                            No timer running
                        </h3>
                    </div>
                </div>

                <!-- Gestures Card -->
                <div class="bg-white rounded-xl shadow-lg p-4 flex-shrink-0">
                    <h2 class="text-base lg:text-lg font-semibold text-gray-800 mb-3 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path>
                        </svg>
                        Gestures
                    </h2>
                    <div class="space-y-2">
                        <div class="bg-gradient-to-br from-green-50 to-emerald-50 p-2 lg:p-3 rounded-lg border border-green-200">
                            <div class="flex items-center">
                                <span class="text-xl lg:text-2xl mr-2 lg:mr-3">☝️</span>
                                <div>
                                    <h3 class="font-semibold text-gray-800 text-xs lg:text-sm">Index Finger</h3>
                                    <p class="text-gray-600 text-xs">Scroll Down</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-gradient-to-br from-blue-50 to-cyan-50 p-2 lg:p-3 rounded-lg border border-blue-200">
                            <div class="flex items-center">
                                <span class="text-xl lg:text-2xl mr-2 lg:mr-3">🖕</span>
                                <div>
                                    <h3 class="font-semibold text-gray-800 text-xs lg:text-sm">Middle Finger</h3>
                                    <p class="text-gray-600 text-xs">Scroll Up</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-gradient-to-br from-red-50 to-pink-50 p-2 lg:p-3 rounded-lg border border-red-200">
                            <div class="flex items-center">
                                <span class="text-xl lg:text-2xl mr-2 lg:mr-3">🖐️</span>
                                <div>
                                    <h3 class="font-semibold text-gray-800 text-xs lg:text-sm">Five Fingers</h3>
                                    <p class="text-gray-600 text-xs">Close Tab</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Camera Feed -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-lg p-4 flex flex-col min-h-[400px] lg:min-h-0">
                <h2 class="text-base lg:text-lg font-semibold text-gray-800 mb-3 flex items-center flex-shrink-0">
                    <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Live Camera Feed
                </h2>
                <div class="flex-1 rounded-lg overflow-hidden border-2 border-gray-200 shadow-inner bg-gray-900 flex items-center justify-center">
                    <img src="/video_feed" class="w-full h-full object-contain">
                </div>
            </div>

        </div>

    </div>

</body>
</html>
